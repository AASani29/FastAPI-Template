# Local development stack.
#
# There is no `api` service yet — that's added once you have a Dockerfile for
# your own app. This gives you the Postgres the app and test suite point at
# by default.
#
#   docker compose up -d db

services:
  db:
    # Plain Postgres — this template has no extension dependency. (The RAG
    # starter this template was extracted from swaps this for
    # pgvector/pgvector:pg17, a Postgres image with the pgvector extension
    # compiled in, needed only because it stores embeddings in-database.)
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      # Host 5433 -> container 5432. Host side is deliberately NOT 5432: a
      # native Postgres install commonly already owns that port, and Docker
      # fails to bind with an unhelpful "address already in use" instead of
      # picking another port for you. DATABASE_URL in .env.example matches
      # this — change both together if you edit this line.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Anything in this directory runs on FIRST boot only. If you change the
      # init script later you must `docker compose down -v` to wipe the volume,
      # or it will never run again.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      # `-U app -d app` because pg_isready defaults to the OS user (root),
      # which does not exist as a Postgres role here and would report failure
      # on a perfectly healthy server.
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      # Generous: the very first boot also runs initdb and the init script.
      retries: 20

volumes:
  # Named volume, so `docker compose down` keeps your data. Use
  # `docker compose down -v` when you actually want a clean database.
  pgdata:
